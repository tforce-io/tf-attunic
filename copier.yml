_min_copier_version: "9.0.0"

# Exclude patterns are matched against rendered destination paths, not
# template source paths. Repo-own AGENTS.md, CLAUDE.md, and LICENSE don't
# need excluding: their .jinja siblings shadow plain files during rendering.
_exclude:
  - ".DS_Store"
  - ".git"
  - ".hg"
  - ".svn"
  - "~*"
  - "*.py[co]"
  - "__pycache__"
  - "copier.yml"
  - "copier.yaml"
  - "README.md"
  - "frameworks"
  - "languages"
  - "licenses"
  - |
      {% if license == 'None' %}
      LICENSE
      COPYING
      COPYING.LESSER
      .agents/license-header.md
      {% elif license == 'MIT' or license == 'ISC' or license == 'BSD-2-Clause' or license == 'BSD-3-Clause' or license == '0BSD' or license == 'Apache-2.0' or license == 'MPL-2.0' %}
      COPYING
      COPYING.LESSER
      {% elif license == 'GPL-3.0-only' or license == 'GPL-3.0-or-later' or license == 'AGPL-3.0-only' or license == 'AGPL-3.0-or-later' %}
      LICENSE
      COPYING.LESSER
      {% elif license == 'LGPL-3.0-only' or license == 'LGPL-3.0-or-later' %}
      LICENSE
      {% endif %}
      {% if license_header is defined and license_header == 'None' %}
      .agents/license-header.md
      {% endif %}

_message_after_update: |
  Update finished. If any file contains conflict markers (<<<<<<< / >>>>>>>)
  or Copier generated *.rej files, resolve them before committing.
  Then review the changes and commit them.

project_name:
  type: str
  help: "What is the name of this project?"
  default: "project-name"
  validator: >-
    {% if not (project_name | regex_search('^[A-Za-z][A-Za-z0-9_. -]*$')) %}
    Start with a letter; use only letters, digits, spaces, dots, dashes, and underscores.
    {% endif %}

languages:
  type: str
  multiselect: true
  help: "Which languages is this project written in? (select all that apply)"
  choices:
    - css
    - go
    - javascript
    - powershell
    - python
    - rust
    - shell
    - typescript
    - text
  validator: >-
    {% if not languages %}
    Select at least one language.
    {% endif %}

frameworks:
  type: str
  multiselect: true
  help: "Which frameworks does this project use? (select all that apply)"
  when: "{{ 'typescript' in languages or 'javascript' in languages }}"
  choices: |
    {%- if 'typescript' in languages %}
    - angular
    - react
    {%- elif 'javascript' in languages %}
    - react
    {%- else %}
    []
    {%- endif %}
  default: []

charset:
  type: str
  help: "Which charset should .editorconfig declare for all files?"
  choices:
    - utf-8
    - utf-8-bom
    - latin1
    - utf-16be
    - utf-16le
  default: utf-8

indent_style:
  type: str
  help: "Which indent style should .editorconfig declare for files whose owner defines none?"
  choices:
    - tab
    - space
  default: tab

indent_size:
  type: int
  help: "Which indent size should .editorconfig declare for files whose owner defines none?"
  default: 2
  validator: >-
    {% if indent_size < 1 %}
    Use a whole number of 1 or more.
    {% endif %}

license:
  type: str
  help: "Which open source license do you want to use?"
  choices:
    - None
    - MIT
    - ISC
    - BSD-2-Clause
    - BSD-3-Clause
    - 0BSD
    - Apache-2.0
    - MPL-2.0
    - GPL-3.0-only
    - GPL-3.0-or-later
    - LGPL-3.0-only
    - LGPL-3.0-or-later
    - AGPL-3.0-only
    - AGPL-3.0-or-later
  default: None

copyright_holder:
  type: str
  help: "Who is the copyright holder (person or organization)?"
  when: "{{ license != 'None' }}"

copyright_year:
  type: int
  help: "What year should be used in the copyright notice?"
  when: "{{ license != 'None' }}"
  default: 2025

license_header:
  type: str
  help: "Which license header style should be used in code files?"
  choices:
    - Full
    - SPDX
    - None
  default: Full
  when: "{{ license != 'None' }}"
